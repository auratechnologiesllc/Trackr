name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: ""
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundleArgs: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundleArgs: "--bundles nsis"
    runs-on: ${{ matrix.runner }}
    env:
      VITE_PAYWALL_API_BASE_URL: ${{ secrets.VITE_PAYWALL_API_BASE_URL }}
      TRACKR_PAYWALL_PUBLIC_KEY_DER_BASE64: ${{ secrets.TRACKR_PAYWALL_PUBLIC_KEY_DER_BASE64 }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release environment
        run: node ./scripts/validate-release-env.mjs

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Trackr v__VERSION__"
          releaseBody: "Automated Trackr release."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }}
